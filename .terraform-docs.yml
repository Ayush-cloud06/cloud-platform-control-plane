formatter: markdown table

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

sections:
  show:
    - requirements
    - inputs
    - outputs

content: |-
  ## Reference

  <details>
  <summary>Inputs, outputs and requirements (generated by terraform-docs)</summary>

  {{ .Requirements }}

  {{ .Inputs }}

  {{ .Outputs }}

  </details>

settings:
  anchor: false
  escape: true
  hide-empty: true
  html: true
  lockfile: false
  required: true
  sensitive: false
  type: true
